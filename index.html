<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Official website of Mijo Radalj, author of Shadow over Ragusa, Republic in the Mist, and the historical fiction Saga of Ragusa." />
<meta name="author" content="Mijo Radalj" />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="https://www.shadowoverragusa.com/" />
<meta property="og:title" content="Mijo Radalj | Shadow over Ragusa" />
<meta property="og:description" content="Official website of Mijo Radalj and the historical fiction Saga of Ragusa." />
<meta property="og:url" content="https://www.shadowoverragusa.com/" />
<meta property="og:type" content="website" />
<title>Mijo Radalj | Shadow over Ragusa | Historical Fiction Writer</title>
<link rel="icon" href="cover.jpg.png" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050507;--fg:#f5efe3;--muted:#c9bfae;--gold:#d7b56d;--gold2:#f1d891;--line:rgba(215,181,109,.35)}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;overflow:hidden} a{color:var(--gold2);text-decoration:none} a:hover{text-decoration:underline}
.site{min-height:100vh;position:relative;background:#000}.slides{position:relative;height:100vh;overflow:hidden}.slide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .75s ease;background:#000}.slide.active{opacity:1;pointer-events:auto}.slide img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}.slide::after{display:none!important;content:none!important}.overlay{display:none!important}.topbar{display:none!important}.footer{display:none!important}
.controls{position:fixed;z-index:25;left:50%;bottom:24px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:rgba(0,0,0,.58);border:1px solid rgba(215,181,109,.3);border-radius:999px;padding:10px 16px;backdrop-filter:blur(8px);box-shadow:0 14px 45px rgba(0,0,0,.45)}.play{border:1px solid var(--gold);background:rgba(215,181,109,.12);color:var(--gold2);border-radius:999px;padding:9px 14px;font-weight:700;cursor:pointer;white-space:nowrap}.track{font-size:12px;color:#f2e2bf;min-width:220px}.dots{display:flex;gap:9px}.dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.25);cursor:pointer}.dot.active{background:var(--gold);border-color:var(--gold);box-shadow:0 0 14px rgba(241,216,145,.9)}.arrow{position:fixed;z-index:25;top:50%;transform:translateY(-50%);border:0;background:rgba(0,0,0,.20);color:white;font-size:48px;line-height:1;cursor:pointer;padding:18px 20px;opacity:.72;text-shadow:0 2px 15px #000}.arrow:hover{opacity:1;color:var(--gold2)}.prev{left:10px}.next{right:10px}
.gallery-toggle{position:fixed;z-index:26;left:50%;bottom:92px;transform:translateX(-50%);display:none;border:1px solid var(--gold);background:rgba(0,0,0,.62);color:var(--gold2);font-family:Cinzel,serif;letter-spacing:1.4px;border-radius:999px;padding:12px 24px;cursor:pointer;box-shadow:0 16px 44px rgba(0,0,0,.45)}.slide.gallery-slide.active .gallery-toggle{display:block}.gallery-toggle:hover{background:rgba(215,181,109,.16)}.gallery-wrap{position:fixed;z-index:60;left:0;right:0;bottom:0;max-height:64vh;overflow:auto;background:linear-gradient(180deg,rgba(0,0,0,.72),rgba(0,0,0,.96));border-top:1px solid rgba(215,181,109,.35);padding:22px clamp(18px,4vw,70px) 96px;display:none}.gallery-wrap.open{display:block}.gallery-head{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:14px}.gallery-head h2{font-family:Cinzel,serif;color:var(--gold2);letter-spacing:1.5px;margin:0}.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.gallery-grid a{display:block;border:1px solid rgba(215,181,109,.25);border-radius:10px;overflow:hidden;background:#111}.gallery-grid img{width:100%;height:140px;object-fit:cover;display:block;transition:transform .25s}.gallery-grid a:hover img{transform:scale(1.04)}.gallery-close{border:1px solid var(--gold);background:rgba(0,0,0,.35);color:var(--gold2);border-radius:999px;padding:8px 14px;cursor:pointer}.empty{color:var(--muted);font-size:14px}.lightbox{position:fixed;z-index:100;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:24px}.lightbox.open{display:flex}.lightbox img{max-width:95vw;max-height:90vh;object-fit:contain;border:1px solid rgba(215,181,109,.35);box-shadow:0 20px 80px rgba(0,0,0,.8)}.lightbox .close{position:absolute;top:18px;right:22px;border:1px solid var(--gold);background:rgba(0,0,0,.5);color:var(--gold2);border-radius:999px;padding:10px 14px;cursor:pointer}.lightbox .lbnav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgba(0,0,0,.35);color:white;font-size:46px;padding:18px;cursor:pointer}.lightbox .lbprev{left:20px}.lightbox .lbnext{right:20px}.credit{position:fixed;z-index:26;right:22px;bottom:90px;font-size:12px;color:#e6d6b9;background:rgba(0,0,0,.35);padding:8px 11px;border-radius:12px;border:1px solid rgba(215,181,109,.18);display:none}.slide.dedication-slide.active ~ .credit{display:block}
@media(max-width:900px){.controls{bottom:36px;max-width:calc(100vw - 24px);flex-wrap:wrap;justify-content:center}.track{min-width:0;width:100%;text-align:center}.arrow{font-size:34px;padding:12px}.gallery-toggle{bottom:122px}.gallery-wrap{max-height:58vh;padding-bottom:132px}.credit{display:none}.gallery-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}.gallery-grid img{height:110px}}
</style>
</head>
<body>
<div class="site">
<main class="slides" id="slides">
  <section class="slide active" data-track="Land of Gods - Jan Močnik.mp3" data-title="Lands of God" data-artist="Jan Močnik" aria-label="Home slide">
    <img class="bg" src="Slide 1.png" alt="Shadow over Ragusa homepage artwork">
  </section>
  <section class="slide gallery-slide" data-track="The Arrival - Jan Močnik.mp3" data-title="The Arrival" data-artist="Jan Močnik" aria-label="Republic in the Mist gallery slide">
    <img class="bg" src="Slide 2.png" alt="Republic in the Mist artwork">
    <button class="gallery-toggle" id="galleryToggle" type="button">Open Gallery</button>
  </section>
  <section class="slide" data-track="Jaromarsburg - Jan Močnik.mp3" data-title="Jaromarsburg" data-artist="Jan Močnik" aria-label="Sunset of Liberty slide">
    <img class="bg" src="Slide 3.png" alt="Sunset of Liberty artwork">
  </section>
  <section class="slide dedication-slide" data-track="Rusalka -Jan Močnik.mp3" data-title="Rusalka" data-artist="Jan Močnik" aria-label="Dedication slide">
    <img class="bg" src="Slide 4.png" alt="Dedication artwork">
  </section>
</main>

<a class="credit" href="https://www.youtube.com/@SlavicAffairs" target="_blank" rel="noopener noreferrer">Jan Močnik · Slavic Affairs</a>
<button class="arrow prev" id="prev" aria-label="Previous slide">‹</button>
<button class="arrow next" id="next" aria-label="Next slide">›</button>

<div class="controls">
  <button class="play" id="playBtn">▶ Play Music</button>
  <div class="track" id="trackLabel">Lands of God — Jan Močnik</div>
  <div class="dots" id="dots"></div>
</div>

<div class="gallery-wrap" id="galleryArea">
  <div class="gallery-head"><h2>Gallery</h2><div><button class="gallery-close" id="galleryClose" type="button">Close</button> <span class="empty" id="galleryStatus">Loading images...</span></div></div>
  <div class="gallery-grid" id="galleryGrid"></div>
</div>

<audio id="audio" preload="auto"></audio>
<div class="lightbox" id="lightbox">
  <button class="close" id="lightboxClose" type="button">Close</button>
  <button class="lbnav lbprev" id="lbPrev" type="button">‹</button>
  <img id="lightboxImg" alt="Gallery image">
  <button class="lbnav lbnext" id="lbNext" type="button">›</button>
</div>
</div>

<script>
const slides=[...document.querySelectorAll('.slide')];
const dotsEl=document.getElementById('dots');
const audio=document.getElementById('audio');
const playBtn=document.getElementById('playBtn');
const trackLabel=document.getElementById('trackLabel');
let current=0;
let musicIndex=0;
let musicStarted=false;
let galleryImages=[];
let galleryCurrent=0;

function safePath(path){return encodeURI(path)}

slides.forEach((_,i)=>{
  const b=document.createElement('button');
  b.className='dot'+(i===0?' active':'');
  b.title='Slide '+(i+1);
  b.onclick=()=>showSlide(i);
  dotsEl.appendChild(b);
});
const dots=[...document.querySelectorAll('.dot')];

function updateVisualNav(){
  slides.forEach((s,n)=>s.classList.toggle('active',n===current));
  dots.forEach((d,n)=>d.classList.toggle('active',n===current));
}

function showSlide(i){
  current=(i+slides.length)%slides.length;
  updateVisualNav();
}

function setMusicTrack(i){
  musicIndex=(i+slides.length)%slides.length;
  const s=slides[musicIndex];
  audio.src=safePath(s.dataset.track);
  trackLabel.textContent=`${s.dataset.title} — ${s.dataset.artist}`;
}

function advanceMusicAndSlide(){
  musicIndex=(musicIndex+1)%slides.length;
  current=musicIndex;
  updateVisualNav();
  setMusicTrack(musicIndex);
  if(musicStarted){audio.play().catch(()=>{});}
}

document.getElementById('next').onclick=()=>showSlide(current+1);
document.getElementById('prev').onclick=()=>showSlide(current-1);
setMusicTrack(0);
updateVisualNav();

playBtn.onclick=async()=>{
  musicStarted=!musicStarted;
  if(musicStarted){
    try{await audio.play();playBtn.textContent='⏸ Pause Music';}
    catch(e){musicStarted=false;playBtn.textContent='▶ Play Music';}
  }else{audio.pause();playBtn.textContent='▶ Play Music';}
};
audio.addEventListener('ended',advanceMusicAndSlide);

const galleryArea=document.getElementById('galleryArea');
document.getElementById('galleryToggle').onclick=()=>galleryArea.classList.add('open');
document.getElementById('galleryClose').onclick=()=>galleryArea.classList.remove('open');

const lightbox=document.getElementById('lightbox');
const lightboxImg=document.getElementById('lightboxImg');
document.getElementById('lightboxClose').onclick=()=>lightbox.classList.remove('open');
lightbox.onclick=(e)=>{if(e.target===lightbox)lightbox.classList.remove('open');};
function openGalleryImage(i){
  if(!galleryImages.length)return;
  galleryCurrent=(i+galleryImages.length)%galleryImages.length;
  lightboxImg.src=galleryImages[galleryCurrent];
  lightbox.classList.add('open');
}
document.getElementById('lbPrev').onclick=(e)=>{e.stopPropagation();openGalleryImage(galleryCurrent-1);};
document.getElementById('lbNext').onclick=(e)=>{e.stopPropagation();openGalleryImage(galleryCurrent+1);};
document.addEventListener('keydown',(e)=>{
  if(!lightbox.classList.contains('open'))return;
  if(e.key==='Escape')lightbox.classList.remove('open');
  if(e.key==='ArrowLeft')openGalleryImage(galleryCurrent-1);
  if(e.key==='ArrowRight')openGalleryImage(galleryCurrent+1);
});

async function loadGallery(){
  const grid=document.getElementById('galleryGrid');
  const status=document.getElementById('galleryStatus');
  const treeApi='https://api.github.com/repos/shadowoverragusa/shadowoverragusa.github.io/git/trees/main?recursive=1';
  const rawBase='https://raw.githubusercontent.com/shadowoverragusa/shadowoverragusa.github.io/main/';
  const encodePath=(p)=>p.split('/').map(encodeURIComponent).join('/');
  try{
    const res=await fetch(treeApi,{cache:'no-store'});
    if(!res.ok)throw new Error('Gallery API unavailable');
    const data=await res.json();
    const imgs=(data.tree||[])
      .filter(f=>f.type==='blob')
      .filter(f=>/^(gallery|assets\/gallery)\//i.test(f.path))
      .filter(f=>/\.(png|jpe?g|webp|gif)$/i.test(f.path));
    if(!imgs.length){status.textContent='Add image files into /gallery to show them here.';return;}
    galleryImages=imgs.map(f=>rawBase+encodePath(f.path));
    status.textContent=`${galleryImages.length} images`;
    grid.innerHTML=galleryImages.map((url,i)=>`<a href="${url}" data-index="${i}"><img src="${url}" alt="Gallery image ${i+1}"></a>`).join('');
    grid.querySelectorAll('a').forEach(a=>{
      a.onclick=(e)=>{e.preventDefault();openGalleryImage(Number(a.dataset.index));};
    });
  }catch(e){status.textContent='Gallery will appear after images are uploaded into the /gallery folder.';}
}
loadGallery();
</script>
</body>
</html>
