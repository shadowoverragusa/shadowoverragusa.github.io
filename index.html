<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Official website of Mijo Radalj, author of Shadow over Ragusa, Republic in the Mist, Sunset of Liberty, and the historical fiction Saga of Ragusa." />
<meta name="author" content="Mijo Radalj" />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="https://www.shadowoverragusa.com/" />
<meta property="og:title" content="Mijo Radalj | Shadow over Ragusa" />
<meta property="og:description" content="Official website of Mijo Radalj and the historical fiction Saga of Ragusa." />
<meta property="og:url" content="https://www.shadowoverragusa.com/" />
<meta property="og:type" content="website" />
<title>Mijo Radalj | Shadow over Ragusa | Historical Fiction Writer</title>
<link rel="icon" href="cover.jpg.png" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#d7b56d;--gold2:#f1d891;--fg:#f5efe3;--bg:#050507}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;overflow:hidden}
.site{position:relative;min-height:100vh;background:#000}
.slides{position:relative;height:100vh;width:100vw;overflow:hidden;background:#000}
.slide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .75s ease;background:#000}
.slide.active{opacity:1;pointer-events:auto}
.slide img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
/* No text overlays: all title/text is baked into the slide images. */
.arrow{position:fixed;z-index:30;top:50%;transform:translateY(-50%);width:44px;height:72px;border:1px solid rgba(215,181,109,.25);background:rgba(0,0,0,.18);color:rgba(255,255,255,.82);font-size:44px;line-height:1;cursor:pointer;border-radius:14px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.arrow:hover{color:var(--gold2);background:rgba(0,0,0,.45);border-color:rgba(215,181,109,.55)}
.prev{left:16px}.next{right:16px}
.controls{position:fixed;z-index:35;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.55);border:1px solid rgba(215,181,109,.35);border-radius:999px;padding:10px 14px;backdrop-filter:blur(8px);box-shadow:0 12px 40px rgba(0,0,0,.45)}
.play{border:1px solid var(--gold);background:rgba(215,181,109,.12);color:var(--gold2);border-radius:999px;padding:8px 13px;font-weight:700;cursor:pointer;white-space:nowrap}
.track{font-size:12px;color:#f2e2bf;min-width:210px;text-align:center;white-space:nowrap}
.dots{display:flex;gap:9px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.22);cursor:pointer;padding:0}.dot.active{background:var(--gold);border-color:var(--gold);box-shadow:0 0 12px rgba(241,216,145,.75)}
.gallery-button{position:fixed;z-index:36;left:50%;bottom:82px;transform:translateX(-50%);display:none;border:1px solid var(--gold);background:rgba(0,0,0,.62);color:var(--gold2);font-family:Cinzel,serif;letter-spacing:1.4px;border-radius:999px;padding:12px 24px;cursor:pointer;box-shadow:0 16px 44px rgba(0,0,0,.45);white-space:nowrap}
body.on-gallery-slide .gallery-button{display:block}.gallery-button:hover{background:rgba(215,181,109,.18)}
.gallery-panel{position:fixed;z-index:80;inset:0;display:none;background:rgba(0,0,0,.92);padding:32px clamp(16px,4vw,64px);overflow:auto}
.gallery-panel.open{display:block}.gallery-top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:18px;border-bottom:1px solid rgba(215,181,109,.28);padding-bottom:14px}.gallery-top h2{font-family:Cinzel,serif;color:var(--gold2);letter-spacing:1.5px;margin:0;font-size:clamp(22px,3vw,38px)}
.close-btn{border:1px solid var(--gold);background:rgba(0,0,0,.35);color:var(--gold2);border-radius:999px;padding:9px 15px;cursor:pointer}.status{font-size:13px;color:#c9bfae}.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:13px}.gallery-grid a{display:block;border:1px solid rgba(215,181,109,.25);border-radius:10px;overflow:hidden;background:#111;cursor:pointer}.gallery-grid img{width:100%;height:145px;object-fit:cover;display:block;transition:transform .25s}.gallery-grid a:hover img{transform:scale(1.04)}
.lightbox{position:fixed;z-index:100;inset:0;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center;padding:22px}.lightbox.open{display:flex}.lightbox img{max-width:94vw;max-height:88vh;object-fit:contain;border:1px solid rgba(215,181,109,.35);box-shadow:0 20px 80px rgba(0,0,0,.8)}.lb-close,.lb-prev,.lb-next{position:absolute;border:1px solid var(--gold);background:rgba(0,0,0,.52);color:var(--gold2);border-radius:999px;cursor:pointer}.lb-close{top:18px;right:22px;padding:10px 14px}.lb-prev,.lb-next{top:50%;transform:translateY(-50%);font-size:34px;width:52px;height:52px}.lb-prev{left:22px}.lb-next{right:22px}
.credit-link{position:fixed;z-index:34;right:18px;bottom:18px;font-size:12px;color:#eadbbf;background:rgba(0,0,0,.35);padding:8px 11px;border-radius:14px;border:1px solid rgba(215,181,109,.2);display:none;text-decoration:none}.credit-link:hover{color:var(--gold2);text-decoration:underline}body.on-dedication-slide .credit-link{display:block}
@media(max-width:800px){html,body{overflow:auto}.slides{height:100svh}.slide img.bg{object-fit:cover}.controls{bottom:12px;max-width:calc(100vw - 18px);flex-wrap:wrap;justify-content:center;border-radius:20px}.track{width:100%;min-width:0;order:3}.gallery-button{bottom:106px}.arrow{width:38px;height:58px;font-size:34px}.prev{left:6px}.next{right:6px}.gallery-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}.gallery-grid img{height:118px}.credit-link{display:none!important}}
</style>
</head>
<body>
<div class="site">
  <main class="slides" id="slides">
    <section class="slide active" data-track="Land of Gods - Jan Močnik.mp3" data-title="Lands of God" data-artist="Jan Močnik">
      <img class="bg" src="Slide 1.png?v=12" alt="Shadow over Ragusa homepage artwork">
    </section>
    <section class="slide" data-track="The Arrival - Jan Močnik.mp3" data-title="The Arrival" data-artist="Jan Močnik" data-gallery="true">
      <img class="bg" src="Slide 2.png?v=12" alt="Republic in the Mist artwork">
    </section>
    <section class="slide" data-track="Jaromarsburg - Jan Močnik.mp3" data-title="Jaromarsburg" data-artist="Jan Močnik">
      <img class="bg" src="Slide 3.png?v=12" alt="Sunset of Liberty artwork">
    </section>
    <section class="slide" data-track="Rusalka -Jan Močnik.mp3" data-title="Rusalka" data-artist="Jan Močnik" data-dedication="true">
      <img class="bg" src="Slide 4.png?v=12" alt="Dedication artwork">
    </section>
  </main>

  <button class="arrow prev" id="prev" aria-label="Previous slide">‹</button>
  <button class="arrow next" id="next" aria-label="Next slide">›</button>

  <button class="gallery-button" id="openGallery" type="button">Open Gallery</button>

  <div class="controls">
    <button class="play" id="playBtn">▶ Play Music</button>
    <div class="track" id="trackLabel">Lands of God — Jan Močnik</div>
    <div class="dots" id="dots"></div>
  </div>

  <a class="credit-link" href="https://www.youtube.com/@SlavicAffairs" target="_blank" rel="noopener noreferrer">Jan Močnik · Slavic Affairs</a>

  <audio id="audio" preload="auto"></audio>

  <section class="gallery-panel" id="galleryPanel" aria-label="Gallery">
    <div class="gallery-top">
      <div>
        <h2>Gallery</h2>
        <div class="status" id="galleryStatus">Loading images...</div>
      </div>
      <button class="close-btn" id="closeGallery" type="button">Close</button>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </section>

  <div class="lightbox" id="lightbox">
    <button class="lb-close" id="lightboxClose" type="button">Close</button>
    <button class="lb-prev" id="lightboxPrev" type="button">‹</button>
    <img id="lightboxImg" alt="Gallery image">
    <button class="lb-next" id="lightboxNext" type="button">›</button>
  </div>
</div>

<script>
const slides=[...document.querySelectorAll('.slide')];
const audio=document.getElementById('audio');
const playBtn=document.getElementById('playBtn');
const trackLabel=document.getElementById('trackLabel');
const dotsEl=document.getElementById('dots');
const openGalleryBtn=document.getElementById('openGallery');
const galleryPanel=document.getElementById('galleryPanel');
const closeGalleryBtn=document.getElementById('closeGallery');
const galleryGrid=document.getElementById('galleryGrid');
const galleryStatus=document.getElementById('galleryStatus');
const lightbox=document.getElementById('lightbox');
const lightboxImg=document.getElementById('lightboxImg');
let current=0;
let musicIndex=0;
let musicStarted=false;
let galleryImages=[];
let galleryIndex=0;

function safePath(path){return encodeURI(path)+'?v=12'}

slides.forEach((_,i)=>{
  const dot=document.createElement('button');
  dot.className='dot'+(i===0?' active':'');
  dot.setAttribute('aria-label','Go to slide '+(i+1));
  dot.onclick=()=>showSlide(i);
  dotsEl.appendChild(dot);
});
const dots=[...document.querySelectorAll('.dot')];

function updateVisualNav(){
  slides.forEach((s,i)=>s.classList.toggle('active',i===current));
  dots.forEach((d,i)=>d.classList.toggle('active',i===current));
  document.body.classList.toggle('on-gallery-slide',slides[current].dataset.gallery==='true');
  document.body.classList.toggle('on-dedication-slide',slides[current].dataset.dedication==='true');
}

function showSlide(i){
  current=(i+slides.length)%slides.length;
  updateVisualNav();
}

function setMusicTrack(i){
  musicIndex=(i+slides.length)%slides.length;
  const s=slides[musicIndex];
  audio.src=safePath(s.dataset.track);
  trackLabel.textContent=`${s.dataset.title} — ${s.dataset.artist}`;
}

function advanceMusicAndSlide(){
  musicIndex=(musicIndex+1)%slides.length;
  current=musicIndex;
  updateVisualNav();
  setMusicTrack(musicIndex);
  if(musicStarted){audio.play().catch(()=>{});}
}

function nextManual(){showSlide(current+1)}
function prevManual(){showSlide(current-1)}
document.getElementById('next').onclick=nextManual;
document.getElementById('prev').onclick=prevManual;

setMusicTrack(0);
updateVisualNav();

playBtn.onclick=async()=>{
  if(!musicStarted){
    musicStarted=true;
    try{await audio.play(); playBtn.textContent='⏸ Pause Music';}
    catch(e){musicStarted=false; playBtn.textContent='▶ Play Music';}
  }else{
    musicStarted=false;
    audio.pause();
    playBtn.textContent='▶ Play Music';
  }
};
audio.addEventListener('ended',advanceMusicAndSlide);

openGalleryBtn.onclick=()=>{galleryPanel.classList.add('open');};
closeGalleryBtn.onclick=()=>{galleryPanel.classList.remove('open');};

function openLightbox(i){
  galleryIndex=i;
  lightboxImg.src=galleryImages[galleryIndex];
  lightbox.classList.add('open');
}
function closeLightbox(){lightbox.classList.remove('open')}
function stepLightbox(n){
  if(!galleryImages.length)return;
  galleryIndex=(galleryIndex+n+galleryImages.length)%galleryImages.length;
  lightboxImg.src=galleryImages[galleryIndex];
}
document.getElementById('lightboxClose').onclick=closeLightbox;
document.getElementById('lightboxPrev').onclick=()=>stepLightbox(-1);
document.getElementById('lightboxNext').onclick=()=>stepLightbox(1);
lightbox.onclick=(e)=>{if(e.target===lightbox)closeLightbox();};
document.addEventListener('keydown',(e)=>{
  if(lightbox.classList.contains('open')){
    if(e.key==='Escape')closeLightbox();
    if(e.key==='ArrowLeft')stepLightbox(-1);
    if(e.key==='ArrowRight')stepLightbox(1);
  }
});

async function loadGallery(){
  const treeApi='https://api.github.com/repos/shadowoverragusa/shadowoverragusa.github.io/git/trees/main?recursive=1';
  const rawBase='https://raw.githubusercontent.com/shadowoverragusa/shadowoverragusa.github.io/main/';
  const encodePath=(p)=>p.split('/').map(encodeURIComponent).join('/');
  try{
    const res=await fetch(treeApi,{cache:'no-store'});
    if(!res.ok)throw new Error('GitHub API failed');
    const data=await res.json();
    const imgs=(data.tree||[])
      .filter(f=>f.type==='blob')
      .filter(f=>/^(gallery|assets\/gallery)\//i.test(f.path))
      .filter(f=>/\.(png|jpe?g|webp|gif)$/i.test(f.path))
      .map(f=>rawBase+encodePath(f.path)+'?v=12');
    galleryImages=imgs;
    if(!galleryImages.length){
      galleryStatus.textContent='No images found. Upload image files into the gallery folder.';
      return;
    }
    galleryStatus.textContent=galleryImages.length+' images';
    galleryGrid.innerHTML=galleryImages.map((url,i)=>`<a data-i="${i}"><img src="${url}" alt="Gallery image ${i+1}"></a>`).join('');
    galleryGrid.querySelectorAll('a').forEach(a=>a.onclick=()=>openLightbox(Number(a.dataset.i)));
  }catch(err){
    galleryStatus.textContent='Gallery could not load. Check that image files are inside the gallery folder.';
  }
}
loadGallery();
</script>
</body>
</html>
